<!DOCTYPE html>
<html>
<head>
  <base href="/bareber-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bareber Barbershop Real-time Live Queue & Booking Mobile App">

  <!-- Aggressive Cache Prevention for App Shell -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bareber_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bareber Barbershop</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <script>
    // 1. Force Service Worker Check & Auto-Reload on New Build
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) {
            reg.update();
            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('🔄 New Flutter Web version detected! Activating...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                });
              }
            });
          }
        });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          console.log('🔄 Service worker updated. Refreshing application...');
          window.location.reload();
        });
      });
    }

    // 2. Immediate Version Check & Stale Cache Purge
    (async function checkAppVersion() {
      try {
        const res = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const currentBuild = data.build_number || data.version;
          const savedBuild = localStorage.getItem('bareber_app_build_version');

          if (savedBuild && savedBuild !== currentBuild) {
            console.log('✨ New application build deployed (' + currentBuild + ' vs ' + savedBuild + '). Purging caches...');
            localStorage.setItem('bareber_app_build_version', currentBuild);

            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            }

            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(r => r.unregister()));
            }

            window.location.reload();
          } else {
            localStorage.setItem('bareber_app_build_version', currentBuild);
          }
        }
      } catch (e) {
        console.debug('[VersionCheck] Bypassed:', e);
      }
    })();

    // 3. Native Browser Notification & Sound Alert System
    window.BareberPush = {
      requestPermission: function () {
        if ('Notification' in window) {
          if (Notification.permission === 'default') {
            Notification.requestPermission().then(function (permission) {
              console.log('🔔 [BareberPush] Notification permission result:', permission);
            }).catch(function (e) {
              console.warn('[BareberPush] Permission error:', e);
            });
          }
        }
      },
      showNotification: function (title, body) {
        console.log('🔔 [BareberPush] showNotification invoked: "' + title + '" - "' + body + '"');

        // A. Audio Sound Chime Alert (Web Audio API)
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Note D5
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12); // Note A5
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
            console.log('🎵 [BareberPush] Audio chime played successfully');
          }
        } catch (audioErr) {
          console.debug('[BareberPush] Audio chime warning:', audioErr);
        }

        // B. Flashing Tab Title Alert
        var originalTitle = 'Bareber Barbershop';
        var flashCount = 0;
        var flashInterval = setInterval(function () {
          document.title = (flashCount % 2 === 0) ? '🔔 ' + title : originalTitle;
          flashCount++;
          if (flashCount > 8) {
            clearInterval(flashInterval);
            document.title = originalTitle;
          }
        }, 700);

        // C. Browser Native Push Notification
        if ('Notification' in window) {
          if (Notification.permission === 'granted') {
            try {
              var n = new Notification(title, {
                body: body,
                icon: '/favicon.png',
                badge: '/favicon.png',
              });
              console.log('🔔 [BareberPush] Browser notification created:', n);
            } catch (notifErr) {
              console.warn('[BareberPush] Direct Notification failed, trying ServiceWorker:', notifErr);
              if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
                navigator.serviceWorker.ready.then(function (reg) {
                  reg.showNotification(title, {
                    body: body,
                    icon: '/favicon.png',
                    badge: '/favicon.png',
                  });
                });
              }
            }
          } else if (Notification.permission === 'default') {
            Notification.requestPermission().then(function (perm) {
              if (perm === 'granted') {
                try {
                  new Notification(title, { body: body, icon: '/favicon.png' });
                } catch (_) {}
              }
            });
          }
        }
      }
    };

    // Auto-request browser notification permission on first user interaction
    window.addEventListener('click', function reqOnce() {
      if (window.BareberPush) window.BareberPush.requestPermission();
      window.removeEventListener('click', reqOnce);
    }, { once: true });
    window.addEventListener('touchstart', function reqOnceTouch() {
      if (window.BareberPush) window.BareberPush.requestPermission();
      window.removeEventListener('touchstart', reqOnceTouch);
    }, { once: true });
  </script>
</head>
<body style="background-color: #121212; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
